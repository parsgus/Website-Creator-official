<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ΣΛ Creator - Official Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        html, body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000000;
            overflow-x: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }

        /* TOMBOL MENU GLASS & ANIMASI GARIS DUA KE X */
        .menu-btn-glass {
            position: fixed;
            top: 20px;
            right: calc(50% - 220px);
            z-index: 300;
            width: 50px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px) brightness(110%);
            -webkit-backdrop-filter: blur(12px) brightness(110%);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        @media (max-width: 480px) {
            .menu-btn-glass {
                right: 20px;
            }
        }

        .menu-btn-glass span {
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 4px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .menu-btn-glass.active span:nth-child(1) {
            transform: translateY(4px) rotate(45deg);
        }

        .menu-btn-glass.active span:nth-child(2) {
            transform: translateY(-4px) rotate(-45deg);
        }

        /* OVERLAY MENU */
        .overlay-menu {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 100vh;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .overlay-menu.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-top {
            width: 100%;
            height: 55%;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            padding: 30px 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
        }

        .menu-pill {
            background-color: #000000;
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .menu-pill:active {
            transform: scale(0.96);
        }

        .menu-pill:first-of-type {
            margin-top: 45px;
        }

        .overlay-bottom {
            width: 100%;
            height: 45%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        /* HERO SECTION */
        .hero-section {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000000;
            padding-bottom: 40px;
        }

        .hero-black-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }

        .video-bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .video-hijau {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            object-fit: cover;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }

        .video-biru {
            position: absolute;
            top: 30%;
            left: 0;
            width: 100%;
            height: 70%;
            object-fit: cover;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
        }

        .central-blur-blob {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, #00d4ff 0%, #0066ff 45%, transparent 70%);
            filter: blur(35px);
            z-index: 2;
            pointer-events: none;
        }

        .content-container {
            position: relative;
            z-index: 4;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 20px 20px;
        }

        .glass-card {
            width: 90%;
            padding: 28px 20px;
            text-align: center;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .title-main {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .title-sub {
            font-size: 1.2rem;
            font-weight: 700;
            color: #22c55e;
        }

        .profile-avatar-wrapper {
            position: relative;
            margin: 40px 0 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar-wrapper::before {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.9) 0%, transparent 70%);
            filter: blur(15px);
            z-index: 0;
        }

        .profile-avatar {
            position: relative;
            z-index: 1;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #facc15;
            border: 4px solid #ef4444;
            object-fit: cover;
        }

        .network-graphic {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 300px;
            z-index: 3;
            pointer-events: none;
        }

        .user-name {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 6px;
            font-family: Georgia, serif;
        }

        .user-role {
            font-size: 1.05rem;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .user-community {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-btn svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        /* SEKSI UNGU */
        .purple-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(to bottom, #000000 0%, #22002b 35%, #6b0080 70%, #d800ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px 40px 20px;
            z-index: 15;
        }

        .question-card {
            width: 90%;
            padding: 22px 18px;
            border-radius: 26px;
            background: rgba(180, 50, 220, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .thought-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
        }

        .purple-avatar-wrapper {
            position: relative;
            margin-left: 10px;
            z-index: 2;
        }

        .purple-avatar-wrapper::before {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(235, 80, 255, 0.9) 0%, transparent 70%);
            filter: blur(20px);
            z-index: 0;
        }

        .purple-avatar {
            position: relative;
            z-index: 1;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3.5px solid #ef4444;
            object-fit: cover;
        }

        .thought-dots {
            position: absolute;
            top: 70px;
            left: 105px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 3;
        }

        .dot-large {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .dot-small {
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
            margin-left: 16px;
        }

        .thought-bubble {
            align-self: flex-end;
            margin-top: 15px;
            width: 82%;
            background-color: #ffffff;
            border-radius: 50px;
            padding: 26px 20px;
            z-index: 2;
            text-align: center;
        }

        .thought-text {
            color: #000000;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: Georgia, serif;
        }

        /* SEKSI SCROLL BARU (ICHIKA & YUK JELAJAHI) */
        .explore-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            /* Gradient mulus menyambung dari #d800ff -> ungu terang -> biru */
            background: linear-gradient(to bottom, #d800ff 0%, #ab26f9 40%, #6848f5 70%, #517bf8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 60px 20px;
            overflow: hidden;
            z-index: 15;
        }

        .ichika-wrapper {
            position: relative;
            width: 100%;
            min-height: 420px;
            margin-top: 10px;
        }

        .ichika-img {
            position: absolute;
            top: 0;
            right: -10px;
            width: 220px;
            height: auto;
            object-fit: contain;
            z-index: 2;
        }

        .ichika-thought-box {
            position: absolute;
            top: 120px;
            left: 10px;
            width: 65%;
            z-index: 3;
        }

        .ichika-dots-top {
            position: absolute;
            top: -55px;
            right: -25px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .ichika-dot-1 {
            width: 32px;
            height: 32px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .ichika-dot-2 {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .ichika-dot-3 {
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .ichika-bubble-round {
            background-color: #ffffff;
            border-radius: 40px;
            padding: 24px 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        .ichika-bubble-round p {
            color: #000000;
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .explore-btn-wrapper {
            margin-top: 40px;
            margin-bottom: 40px;
            z-index: 5;
        }

        .explore-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            font-size: 1.45rem;
            font-weight: 800;
            padding: 14px 42px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .explore-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.5);
        }

        /* REVEAL SCROLL ANIMATION */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
