<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ΣΛ Creator - Official Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000000;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        /* TOMBOL MENU GARIS DUA (DIPERBAIKI) */
        .menu-btn-glass {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999999;
            width: 48px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
        }

        .menu-btn-glass span {
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 4px;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .menu-btn-glass.active span:nth-child(1) {
            transform: translateY(4px) rotate(45deg);
        }

        .menu-btn-glass.active span:nth-child(2) {
            transform: translateY(-4px) rotate(-45deg);
        }

        /* OVERLAY MENU (ANIMASI LEBIH SMOOTH) */
        .overlay-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99998;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .overlay-menu.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .overlay-top {
            width: 100%;
            height: 50%;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            padding: 80px 25px 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .menu-pill {
            background-color: #000000;
            color: #ffffff;
            padding: 12px 26px;
            border-radius: 50px;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            display: inline-block;
        }

        .overlay-bottom {
            width: 100%;
            height: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
        }

        /* HERO SECTION (PERBAIKAN TRANSISI SCROLL) */
        .hero-section {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000000;
            padding-bottom: 20px;
        }

        .video-bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            /* Efek fading agar nyambung ke seksi ungu */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
        }

        .video-hijau {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 55%;
            object-fit: cover;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }

        .video-biru {
            position: absolute;
            top: 35%; left: 0; width: 100%; height: 65%;
            object-fit: cover;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
        }

        .central-blur-blob {
            position: absolute;
            top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, #00d4ff 0%, #0066ff 45%, transparent 70%);
            filter: blur(35px);
            z-index: 2;
            pointer-events: none;
        }

        .content-container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 20px 20px 20px;
        }

        .glass-card {
            width: 90%;
            padding: 24px 20px;
            text-align: center;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 15;
        }

        .title-main { font-size: 2.2rem; font-weight: 800; color: #ffffff; margin-bottom: 6px; }
        .title-sub { font-size: 1.15rem; font-weight: 700; color: #22c55e; }

        .profile-avatar-wrapper {
            position: relative;
            margin: 35px 0 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar-wrapper::before {
            content: '';
            position: absolute;
            width: 130px; height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.9) 0%, transparent 70%);
            filter: blur(15px);
            z-index: 0;
        }

        .profile-avatar {
            position: relative;
            z-index: 1;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 4px solid #ef4444;
            object-fit: cover;
        }

        .network-graphic {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 210px; height: 290px;
            z-index: 3;
            pointer-events: none;
        }

        .user-name { font-size: 2.1rem; font-weight: 800; margin-bottom: 4px; font-family: Georgia, serif; }
        .user-role { font-size: 1.05rem; opacity: 0.9; margin-bottom: 4px; }
        .user-community { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 50;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            z-index: 60;
            padding: 8px;
            touch-action: manipulation;
        }

        .social-btn svg {
            width: 32px; height: 32px;
            fill: #ffffff;
            pointer-events: none;
        }

        /* SEKSI UNGU (TIDAK ADA LAGI CELAH HITAM) */
        .purple-section {
            width: 100%;
            /* Mulai tepat dari hitam penuh agar transisinya mulus dari hero */
            background: linear-gradient(180deg, #000000 0%, #230038 25%, #64008a 60%, #9900cc 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px 20px;
            position: relative;
            z-index: 20;
            margin-top: -2px; /* Mencegah garis putih/putus-putus */
        }

        .question-card {
            width: 90%;
            padding: 22px 18px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-bottom: 30px;
        }

        .question-text { font-size: 1.3rem; font-weight: 800; line-height: 1.35; color: #ffffff; }

        .thought-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
        }

        .purple-avatar-wrapper {
            position: relative;
            margin-left: 10px;
            z-index: 2;
        }

        .purple-avatar-wrapper::before {
            content: '';
            position: absolute;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(235, 80, 255, 0.9) 0%, transparent 70%);
            filter: blur(18px);
            z-index: 0;
        }

        .purple-avatar {
            position: relative;
            z-index: 1;
            width: 85px; height: 85px;
            border-radius: 50%;
            border: 3.5px solid #ef4444;
            object-fit: cover;
        }

        .thought-dots {
            position: absolute;
            top: 65px; left: 95px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 3;
        }

        .dot-large { width: 18px; height: 18px; background-color: #ffffff; border-radius: 50%; }
        .dot-small { width: 11px; height: 11px; background-color: #ffffff; border-radius: 50%; margin-left: 14px; }

        .thought-bubble {
            align-self: flex-end;
            margin-top: 10px;
            width: 85%;
            background-color: #ffffff;
            border-radius: 40px;
            padding: 24px 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .thought-text {
            color: #000000;
            font-size: 1.15rem;
            font-weight: 800;
            font-family: Georgia, serif;
            text-align: left;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* SEKSI ICHIKA (PERBAIKAN POSISI DAN KEMIRINGAN) */
        .explore-section {
            width: 100%;
            background: linear-gradient(180deg, #9900cc 0%, #7a22e2 35%, #5046e5 70%, #3b82f6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 70px 20px;
            position: relative;
            overflow: hidden;
            z-index: 20;
        }

        .ichika-wrapper {
            position: relative;
            width: 100%;
            min-height: 500px; /* Diberi ruang cukup tinggi agar kaki tetap terlihat */
            margin-top: 20px;
        }

        .ichika-img {
            position: absolute;
            bottom: -10px; /* Merapat ke bawah */
            right: -70px; /* Digeser drastis ke kanan agar tubuh bagian kanannya kepotong */
            width: 250px; /* Ukuran diperbesar sedikit */
            height: auto;
            object-fit: contain;
            z-index: 2;
            transform: rotate(8deg); /* Dibuat lebih mereng */
            transform-origin: bottom center; /* Sumbu rotasi dari bawah */
        }

        .ichika-thought-box {
            position: absolute;
            top: 130px; /* Posisi text box disejajarkan dekat dada/pundaknya */
            left: 0;
            width: 72%;
            z-index: 3;
        }

        .ichika-dots-top {
            position: absolute;
            top: -38px;
            right: -10px;
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }

        .ichika-dot-1 { width: 22px; height: 22px; background-color: #ffffff; border-radius: 50%; }
        .ichika-dot-2 { width: 14px; height: 14px; background-color: #ffffff; border-radius: 50%; }
        .ichika-dot-3 { width: 8px; height: 8px; background-color: #ffffff; border-radius: 50%; }

        .ichika-bubble-round {
            background-color: #ffffff;
            border-radius: 35px;
            padding: 22px 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: left;
        }

        .ichika-bubble-round p {
            color: #000000;
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .explore-btn-wrapper {
            margin-top: 25px;
            position: relative;
            z-index: 50;
        }

        .explore-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 800;
            padding: 14px 44px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .explore-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
