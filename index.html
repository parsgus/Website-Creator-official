<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ΣΛ Creator - Official Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030814;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #030814;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* BAGIAN ATAS (HIJAU) */
        .section-top {
            position: relative;
            width: 100%;
            height: 50vh;
            min-height: 380px;
            background-color: #0f2415;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* TRANSISI GRADIENT HALUS */
        .section-top::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, rgba(15, 36, 21, 0), rgba(2, 62, 138, 0.9));
            z-index: 2;
            pointer-events: none;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: block;
        }

        /* REALISTIC LIQUID GLASS CARD (KACA TEBAL & BENING) */
        .glass-card-top, .glass-card-bottom {
            position: relative;
            z-index: 3;
            width: 88%;
            padding: 32px 20px;
            text-align: center;
            border-radius: 32px;
            
            /* Background sangat transparan & blur tipis (Kaca Jernih) */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2.5px) contrast(110%) brightness(108%);
            -webkit-backdrop-filter: blur(2.5px) contrast(110%) brightness(108%);
            
            /* Pinggiran Kaca Refraktif & Bevel Light */
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.35),
                inset 0 2px 3px rgba(255, 255, 255, 0.85),    /* Kilau Atas */
                inset 0 -2px 4px rgba(0, 0, 0, 0.5),          /* Bayangan Bawah Kaca */
                inset 2px 0 3px rgba(255, 255, 255, 0.4),     /* Sinar Kiri */
                inset -2px 0 3px rgba(0, 0, 0, 0.3);         /* Sinar Kanan */
        }

        .title-main {
            font-size: 2.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 12px;
        }

        .title-sub {
            font-size: 1.25rem;
            font-weight: 700;
            color: #22c55e;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9), 0 0 8px rgba(34, 197, 94, 0.5);
        }

        /* FOTO PROFIL DENGAN GLOW BIRU BLUR HALO */
        .profile-avatar-container {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .profile-avatar-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #0077ff;
            filter: blur(20px);
            opacity: 0.95;
            z-index: -1;
            box-shadow: 0 0 30px #00a2ff;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #facc15;
            border: 4px solid #ef4444;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            display: block;
        }

        /* BAGIAN BAWAH (BIRU) */
        .section-bottom {
            position: relative;
            width: 100%;
            min-height: 60vh;
            background-color: #023e8a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 85px 20px 50px 20px;
        }

        /* GRAFIK JARINGAN HITAM (NETWORK NODES) */
        .network-graphic {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 300px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.95;
        }

        .user-name {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            font-family: Georgia, serif;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .user-role {
            font-size: 1.1rem;
            color: #ffffff;
            font-weight: 600;
            opacity: 0.95;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .user-community {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 25px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .social-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s ease;
        }

        .social-btn:active {
            transform: scale(0.9);
        }

        .social-btn svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
    </style>
</head>

    <!-- JAVASCRIPT AUTO-PLAY -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videos = document.querySelectorAll('video');

            function forcePlayVideos() {
                videos.forEach(video => {
                    video.muted = true;
                    video.defaultMuted = true;
                    
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log("Autoplay di-block oleh HP, menunggu interaksi.", error);
                        });
                    }
                });
            }

            forcePlayVideos();

            const userEvents = ['touchstart', 'touchend', 'click', 'scroll', 'pointerdown'];
            
            function handleFirstTouch() {
                forcePlayVideos();
                userEvents.forEach(evt => {
                    window.removeEventListener(evt, handleFirstTouch);
                });
            }

            userEvents.forEach(evt => {
                window.addEventListener(evt, handleFirstTouch, { passive: true });
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    forcePlayVideos();
                }
            });
        });
    </script>
