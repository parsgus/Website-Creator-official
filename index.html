<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Anime Editor</title>
    <!-- Menggunakan font Google agar mirip dengan gambar referensimu -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & BASIC SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Warna gradient ungu ke biru persis seperti gambar */
            background: linear-gradient(180deg, #aa00ff 0%, #5078ff 100%);
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVBAR & TOMBOL GARIS DUA --- */
        nav {
            display: flex;
            justify-content: flex-end; /* Memastikan tombol di kanan */
            align-items: center;
            padding: 20px 25px;
            position: relative;
            z-index: 9999;
        }

        /* Ini tombol garis duanya (Hamburger Menu) */
        .menu-btn {
            width: 32px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            z-index: 9999; 
            touch-action: manipulation;
        }

        .menu-btn span {
            width: 100%;
            height: 4px;
            background-color: white;
            border-radius: 4px;
            transition: all 0.3s ease-in-out;
            transform-origin: left center;
        }

        /* Animasi saat tombol garis dua di klik (berubah jadi silang) */
        .menu-btn.active span:nth-child(1) {
            transform: rotate(45deg);
        }
        .menu-btn.active span:nth-child(2) {
            transform: rotate(-45deg);
        }

        /* --- SIDEBAR MENU (Muncul saat tombol diklik) --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%; /* Sembunyikan di luar layar saat belum diklik */
            width: 250px;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            transition: right 0.4s ease;
            z-index: 9998; 
            padding-top: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .sidebar.active {
            right: 0; /* Munculkan menu ke layar */
        }

        .sidebar a {
            text-decoration: none;
            color: #aa00ff;
            font-weight: bold;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .sidebar a:active {
            background-color: #aa00ff;
            color: white;
        }

        /* --- MAIN CONTENT (Gambar, Gelembung, Tombol) --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-top: 10px;
        }

        .scene-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 450px;
        }

        /* Gambar Karakter Ichika */
        .character {
            position: absolute;
            top: -20px;
            right: -40px; /* Sengaja digeser ke kanan agar terpotong layar seperti aslinya */
            width: 220px;
            transform: rotate(5deg); /* Sedikit dimiringkan */
            z-index: 2;
        }

        /* Gelembung Pikiran Utama */
        .thought-bubble {
            position: absolute;
            top: 70px;
            left: 15px;
            background-color: white;
            color: black;
            width: 250px;
            height: 250px;
            border-radius: 50%; /* Membuatnya bulat/oval sempurna */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            font-weight: 700;
            font-size: 16px;
            line-height: 1.4;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
            z-index: 2;
        }

        /* Titik-titik gelembung kecil yang menyambung ke karakter */
        .dot {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            z-index: 1;
        }
        .dot-1 {
            width: 15px;
            height: 15px;
            top: 85px;
            right: 120px;
        }
        .dot-2 {
            width: 28px;
            height: 28px;
            top: 110px;
            right: 140px;
        }

        /* Tombol "Yuk jelajahi" */
        .btn-jelajahi {
            margin-top: auto;
            margin-bottom: 50px;
            background-color: rgba(255, 255, 255, 0.35);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-family: 'Fredoka One', cursive, sans-serif;
            font-size: 24px;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            transition: 0.2s;
            z-index: 10;
        }

        .btn-jelajahi:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.5);
        }

    </style>
</head>
<body>

    <!-- Navigasi -->
    <nav>
        <!-- Tombol Garis Dua -->
        <div class="menu-btn" id="tombolMenu">
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- Sidebar Menu yang disembunyikan -->
    <div class="sidebar" id="menuSidebar">
        <a href="information.html">Information</a>
        <a href="https://parsgus.my.id/">Page Developer</a>
    </div>

    <!-- Konten Utama -->
    <div class="main-content">
        <div class="scene-container">
            <!-- MENGGUNAKAN NAMA FILE KAMU: ihcika.png -->
            <img src="ihcika.png" alt="Ichika" class="character">
            
            <!-- Elemen Gelembung Pikiran -->
            <div class="dot dot-1"></div>
            <div class="dot dot-2"></div>
            <div class="thought-bubble">
                "Jadi yah di jadiin marga sekalian buat nampung yang bener bener mau belajar jadi editor"
            </div>
        </div>

        <!-- Tombol Bawah -->
        <button class="btn-jelajahi">Yuk jelajahi</button>
    </div>

    <!-- JAVASCRIPT UNTUK MEMFUNGSIKAN TOMBOL GARIS DUA -->
    <script>
        const tombolMenu = document.getElementById('tombolMenu');
        const menuSidebar = document.getElementById('menuSidebar');

        // Menggunakan event 'click' dan 'touchstart' agar responsif di HP
        ['click', 'touchstart'].forEach(function(evt) {
            tombolMenu.addEventListener(evt, function(e) {
                e.preventDefault(); // Mencegah double klik di mobile
                tombolMenu.classList.toggle('active');
                menuSidebar.classList.toggle('active');
            }, { passive: false });
        });
    </script>

</body>
</html>
