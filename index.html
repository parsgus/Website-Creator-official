<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ΣΛ Creator - Official Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
            background-color: #000000;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000000;
            overflow-x: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
        }

        /* ================= SEKSI 1: HERO ================= */
        .hero-section {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000000;
            padding-bottom: 20px;
        }

        /* LAYER OVERLAY HITAM PEKAT SAAT SCROLL */
        .hero-black-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            will-change: opacity;
        }

        /* BACKGROUND VIDEO BERLAPIS */
        .video-bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .video-hijau {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48%;
            object-fit: cover;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }

        .video-biru {
            position: absolute;
            top: 30%;
            left: 0;
            width: 100%;
            height: 70%;
            object-fit: cover;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 25%, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%);
        }

        /* ELEMEN BULAT BLUR BIRU CERAH */
        .central-blur-blob {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, #00d4ff 0%, #0066ff 45%, rgba(0, 102, 255, 0) 70%);
            filter: blur(35px);
            -webkit-filter: blur(35px);
            z-index: 2;
            pointer-events: none;
            opacity: 0.9;
        }

        /* KONTEN HERO */
        .content-container {
            position: relative;
            z-index: 4;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 20px 20px;
        }

        .glass-card {
            width: 88%;
            padding: 32px 20px;
            text-align: center;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2.5px) contrast(110%) brightness(108%);
            -webkit-backdrop-filter: blur(2.5px) contrast(110%) brightness(108%);
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.35),
                inset 0 2px 3px rgba(255, 255, 255, 0.85),
                inset 0 -2px 4px rgba(0, 0, 0, 0.5),
                inset 2px 0 3px rgba(255, 255, 255, 0.4),
                inset -2px 0 3px rgba(0, 0, 0, 0.3);
        }

        .title-main {
            font-size: 2.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
            margin-bottom: 12px;
        }

        .title-sub {
            font-size: 1.25rem;
            font-weight: 700;
            color: #22c55e;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9), 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .profile-avatar-wrapper {
            position: relative;
            margin: 45px 0 35px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-avatar-wrapper::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.95) 0%, rgba(0, 119, 182, 0.5) 60%, transparent 100%);
            filter: blur(18px);
            z-index: 0;
        }

        .profile-avatar {
            position: relative;
            z-index: 1;
            width: 102px;
            height: 102px;
            border-radius: 50%;
            background-color: #facc15;
            border: 4px solid #ef4444;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(0, 180, 255, 0.6);
            display: block;
        }

        .network-graphic {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 300px;
            z-index: 3;
            pointer-events: none;
            opacity: 0.9;
        }

        .user-name {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            font-family: Georgia, serif;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        .user-role {
            font-size: 1.1rem;
            color: #ffffff;
            font-weight: 600;
            opacity: 0.95;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .user-community {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 25px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .social-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s ease;
        }

        .social-btn:active {
            transform: scale(0.9);
        }

        .social-btn svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        /* ================= SEKSI 2: SEKSI UNGU ================= */
        .purple-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(to bottom, 
                #000000 0%, 
                #000000 25%, 
                #22002b 50%, 
                #6b0080 75%, 
                #b000d1 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 80px 20px;
            z-index: 15;
        }

        .question-card {
            width: 90%;
            padding: 24px 20px;
            border-radius: 28px;
            background: rgba(180, 50, 220, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        inset 0 2px 4px rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.35;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .thought-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            padding: 10px 5px;
        }

        .purple-avatar-wrapper {
            position: relative;
            margin-left: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .purple-avatar-wrapper::before {
            content: '';
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(235, 80, 255, 0.95) 0%, rgba(180, 0, 220, 0.6) 60%, transparent 100%);
            filter: blur(22px);
            -webkit-filter: blur(22px);
            z-index: 0;
        }

        .purple-avatar {
            position: relative;
            z-index: 1;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background-color: #facc15;
            border: 3.5px solid #ef4444;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .thought-dots {
            position: absolute;
            top: 75px;
            left: 110px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 3;
        }

        .dot-large {
            width: 22px;
            height: 22px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .dot-small {
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 50%;
            margin-left: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .thought-bubble {
            align-self: flex-end;
            margin-top: 15px;
            margin-right: 5px;
            width: 82%;
            background-color: #ffffff;
            border-radius: 60px;
            padding: 30px 24px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            z-index: 2;
            text-align: center;
        }

        .thought-text {
            color: #000000;
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1.35;
            font-family: Georgia, serif;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            filter: blur(10px);
            -webkit-filter: blur(10px);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: opacity, transform, filter;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            -webkit-filter: blur(0);
        }
    </style>
</head>
<body>

    <div class="wrapper">

    <!-- JAVASCRIPT: AUTOPLAY, SCROLL FADE TO BLACK, & REVEAL ANIMATION -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. EFEK HITAM DINAMIS SAAT USER SCROLL KE BAWAH
            const heroOverlay = document.getElementById('heroOverlay');
            window.addEventListener('scroll', () => {
                const scrollY = window.scrollY;
                // Dalam jarak scroll 250px seksi hero langsung menjadi 100% hitam pekat
                const opacity = Math.min(scrollY / 250, 1);
                if (heroOverlay) {
                    heroOverlay.style.opacity = opacity;
                }
            }, { passive: true });

            // 2. AUTOPLAY VIDEO HANDLER
            const videos = document.querySelectorAll('video');

            function forcePlayVideos() {
                videos.forEach(video => {
                    video.muted = true;
                    video.defaultMuted = true;
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log("Autoplay di-block, menunggu interaksi.", error);
                        });
                    }
                });
            }

            forcePlayVideos();

            const userEvents = ['touchstart', 'touchend', 'click', 'scroll', 'pointerdown'];
            function handleFirstTouch() {
                forcePlayVideos();
                userEvents.forEach(evt => window.removeEventListener(evt, handleFirstTouch));
            }
            userEvents.forEach(evt => window.addEventListener(evt, handleFirstTouch, { passive: true }));

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') forcePlayVideos();
            });

            // 3. SCROLL REVEAL ANIMATION
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, observerOptions);

            const revealElements = document.querySelectorAll('.reveal');
            revealElements.forEach(el => observer.observe(el));
        });
    </script>
